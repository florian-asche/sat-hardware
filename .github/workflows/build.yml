# Three chained jobs:
#   build-deb:  build the Debian package per architecture (artifact: dist/*.deb)
#   image:      take that .deb and install it into the runtime image (Dockerfile)
#   manifest:   combine the per-architecture images into one multi-arch tag
# The image contains exactly the package that is built in the first job.
# Images are pushed to GHCR on main and on version tags (not for pull requests).
# On version tags a GitHub release with the .deb files attached is created as well.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sat-hardware-agent

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: script/build-deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  image:
    name: Image (${{ matrix.arch }})
    needs: build-deb
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # dist/ then holds only this architecture's .deb.
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist
      - name: Compute version tag
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${GITHUB_REF_NAME//\//-}"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: docker build --pull -t "$IMAGE:${{ steps.v.outputs.version }}-${{ matrix.arch }}" .
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:${{ steps.v.outputs.version }}-${{ matrix.arch }}" sat-hardware-agent --help
          docker run --rm "$IMAGE:${{ steps.v.outputs.version }}-${{ matrix.arch }}" sat1 --help
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:${{ steps.v.outputs.version }}-${{ matrix.arch }}"

  manifest:
    name: Multi-arch manifest
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${GITHUB_REF_NAME//\//-}"; fi
          tags="-t $IMAGE:$v"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags="$tags -t $IMAGE:latest"; fi
          docker buildx imagetools create $tags "$IMAGE:$v-amd64" "$IMAGE:$v-arm64"

  release:
    name: GitHub release
    needs: [build-deb, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the Debian package version
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends dpkg-dev
          version="$(dpkg-parsechangelog -ldebian/changelog --show-field Version)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match debian/changelog version ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*|*~*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag $prerelease
