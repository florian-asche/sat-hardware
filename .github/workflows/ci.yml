name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgpiod-dev
          pip install -e '.[daemon,dev]'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0.dev0
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgpiod-dev
          pip install -e '.[daemon,dev]'
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0.dev0
      - run: pytest

  debian-metadata:
    name: Debian changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Changelog parses and has a version
        run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends dpkg-dev
          dpkg-parsechangelog -ldebian/changelog --show-field Version
