# SAT-Hardware-Agent for the FutureProofHomes Satellite1 HAT.
# Only ONE process may own the XMOS/I2C hardware: do not run the Debian
# service (satellite1d) at the same time.
services:
  sat-hardware-agent:
    image: ${IMAGE:-ghcr.io/florian-asche/sat-hardware-agent:latest}
    container_name: sat-hardware-agent
    restart: unless-stopped
    # LVA's peripheral API listens on 127.0.0.1:6055 of the host.
    network_mode: host
    environment:
      LOG_VERBOSITY: ${LOG_VERBOSITY:-0}
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/i2c-1:/dev/i2c-1
      - /dev/spidev0.0:/dev/spidev0.0
    group_add:
      - "${GPIO_GID:-997}"
      - "${I2C_GID:-998}"
      - "${SPI_GID:-999}"
    volumes:
      - ./config:/config
      - sat-hardware-agent-state:/var/lib/satellite1
      # Control socket + hardware lock; mount the same volume into other containers
      # (CLI, web console) that need to talk to the agent.
      - sat-hardware-agent-run:/run/satellite1

volumes:
  sat-hardware-agent-state:
  sat-hardware-agent-run:
